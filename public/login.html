<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - JAVI COFFEE</title>

    <!-- Nhúng file CSS đồng bộ -->
    <link rel="stylesheet" href="css/global.css" />
    <!-- Nhúng FontAwesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/logo.css" />
    <script src="js/auth.js"></script>

    <style>
      /* Căn giữa khung đăng nhập ở giữa màn hình */
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background-color: var(--color-bg-main); /* Sử dụng nền đen tuyền */
      }

      /* Thiết kế Login Card */
      .login-card {
        background-color: var(--color-bg-surface);
        padding: 40px 30px;
        border-radius: 8px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
        border: 1px solid var(--color-border);
        width: 100%;
        max-width: 420px;
        text-align: center;
      }

      .form-group {
        margin-bottom: 20px;
        text-align: left;
      }

      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        color: var(--color-text-main);
      }

      /* Thiết kế cho khối chứa mật khẩu và icon mắt */
      .password-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }

      .toggle-password {
        position: absolute;
        right: 15px;
        cursor: pointer;
        color: var(--color-text-muted);
      }

      .toggle-password:hover {
        color: var(--color-primary);
      }

      .login-btn {
        width: 100%;
        margin-top: 15px;
        font-size: 16px;
        padding: 12px;
        border-radius: 4px; /* Bo góc 4px */
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <img
        src="images/logo-javi.png"
        alt="JAVI COFFEE"
        class="javi-logo-login"
      />

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Tên đăng nhập</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Nhập tên đăng nhập"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Nhập mật khẩu"
              required
            />
            <!-- Thêm icon con mắt từ FontAwesome -->
            <i class="fas fa-eye toggle-password" id="togglePassword"></i>
          </div>
        </div>

        <button type="submit" class="btn login-btn">Đăng Nhập</button>
      </form>
    </div>

    <script>
      // Xử lý ẩn hiện mật khẩu
      const togglePassword = document.getElementById("togglePassword");
      const passwordInput = document.getElementById("password");

      togglePassword.addEventListener("click", function () {
        // Đổi type của input
        const type =
          passwordInput.getAttribute("type") === "password"
            ? "text"
            : "password";
        passwordInput.setAttribute("type", type);

        // Đổi icon mắt mở / mắt nhắm
        this.classList.toggle("fa-eye-slash");
      });

      document
        .getElementById("loginForm")
        .addEventListener("submit", async function (event) {
          event.preventDefault(); // Ngăn trình duyệt reload lại trang

          // Lấy dữ liệu từ form
          const username = document.getElementById("username").value;
          const password = document.getElementById("password").value;

          // Chuẩn bị payload
          const payload = {
            TenDangNhap: username,
            MatKhau: password,
          };

          try {
            const response = await fetch("/api/login", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify(payload),
            });

            if (response.ok) {
              const data = await response.json();
              console.log("Phản hồi từ server:", data);

              // BỔ SUNG: Lưu thông tin người dùng vào LocalStorage
              localStorage.setItem("currentUser", JSON.stringify(data.data));

              await javiAlert("Đăng nhập thành công!");
              window.location.href = "dashboard.html";
            } else {
              alert("Đăng nhập thất bại: Sai tên đăng nhập hoặc mật khẩu!");
            }
          } catch (error) {
            console.error("Lỗi khi gọi API:", error);
            alert("Chưa thể kết nối tới máy chủ API. Vui lòng thử lại sau!");
          }
        });
    </script>
  </body>
</html>
