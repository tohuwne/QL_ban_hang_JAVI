<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản Lý Loại Sản Phẩm - JAVI COFFEE</title>
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/sidebar.css" />
    <link rel="stylesheet" href="/css/san-pham.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="/js/auth.js"></script>
  </head>
  <body>
    <div class="sidebar"></div>

    <div class="main-content">
      <div class="page-header">
        <h2><i class="fas fa-tags"></i> QUẢN LÝ LOẠI SẢN PHẨM</h2>
        <button class="btn" onclick="openModal()">
          <i class="fas fa-plus"></i> Thêm Loại Sản Phẩm
        </button>
      </div>

      <div class="filter-bar" style="margin-bottom: 15px; display: flex">
        <input
          type="text"
          id="searchInput"
          placeholder="Tìm kiếm theo Mã Loại, Tên Loại..."
          onkeyup="filterData()"
          style="
            flex: 1;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #333;
            background: #222;
            color: #fff;
          "
        />
      </div>

      <div class="table-responsive">
        <table id="dataTable">
          <thead>
            <tr>
              <th>Mã Loại Sản Phẩm</th>
              <th>Tên Loại Sản Phẩm</th>
              <th>Hành động</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="3" style="text-align: center">
                Đang tải dữ liệu...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- KHUNG MODAL -->
    <div class="modal-overlay" id="addModal">
      <div class="modal-content">
        <div class="modal-header">
          <h3><i class="fas fa-plus-circle"></i> Thêm Loại Sản Phẩm</h3>
          <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>
        <form id="addForm">
          <div class="form-group">
            <label
              >Mã Loại Sản Phẩm (Tối đa 3 ký tự)
              <span style="color: red">*</span></label
            >
            <input type="text" id="maLoaiSP" required maxlength="3" />
          </div>
          <div class="form-group">
            <label>Tên Loại Sản Phẩm <span style="color: red">*</span></label>
            <input type="text" id="tenLoaiSP" required />
          </div>
          <div
            class="modal-footer"
            style="
              display: flex;
              justify-content: flex-end;
              gap: 10px;
              margin-top: 20px;
            "
          >
            <button
              type="button"
              class="btn"
              style="background-color: #333; color: #fff"
              onclick="closeModal()"
            >
              Hủy
            </button>
            <button type="submit" class="btn">Lưu Loại Sản Phẩm</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      let listData = [];
      let editId = null;

      function openModal() {
        document.getElementById("addForm").reset();
        editId = null;
        document.getElementById("maLoaiSP").readOnly = false;
        document.querySelector(".modal-header h3").innerHTML =
          '<i class="fas fa-plus-circle"></i> Thêm Loại Sản Phẩm';
        document.getElementById("addModal").style.display = "flex";
      }

      function closeModal() {
        document.getElementById("addModal").style.display = "none";
      }

      function editData(id) {
        const item = listData.find((x) => x.MaLoaiSP.trim() === id.trim());
        if (!item) return;
        editId = item.MaLoaiSP.trim();
        document.getElementById("maLoaiSP").value = item.MaLoaiSP.trim();
        document.getElementById("maLoaiSP").readOnly = true;
        document.getElementById("tenLoaiSP").value = item.TenLoaiSP;
        document.querySelector(".modal-header h3").innerHTML =
          '<i class="fas fa-edit"></i> Cập Nhật Loại Sản Phẩm';
        document.getElementById("addModal").style.display = "flex";
      }

      async function deleteData(id) {
        const confirmed = await javiConfirm("Bạn có chắc muốn xóa Loại Sản Phẩm " + id + " ?");
        if (!confirmed) return;
        try {
          const res = await fetch("/api/loai-sp/" + id.trim(), {
            method: "DELETE",
          });
          const data = await res.json();
          if (data.success) {
            alert(data.message);
            loadData();
          } else alert("Lỗi: " + data.message);
        } catch (e) {
          alert("Lỗi kết nối server");
        }
      }

      document
        .getElementById("addForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          const payload = {
            maLoaiSP: document.getElementById("maLoaiSP").value.trim(),
            tenLoaiSP: document.getElementById("tenLoaiSP").value.trim(),
          };

          const url = editId ? "/api/loai-sp/" + editId : "/api/loai-sp";
          const method = editId ? "PUT" : "POST";

          try {
            const res = await fetch(url, {
              method,
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });
            const data = await res.json();
            if (data.success) {
              alert(data.message);
              closeModal();
              loadData();
            } else alert("Lỗi: " + data.message);
          } catch (err) {
            alert("Lỗi Server!");
          }
        });

      function filterData() {
        const val = document.getElementById("searchInput").value.toLowerCase();
        const rows = document.querySelectorAll("#dataTable tbody tr");
        rows.forEach((row) => {
          if (row.cells.length < 3) return;
          row.style.display = row.textContent.toLowerCase().includes(val)
            ? ""
            : "none";
        });
      }

      async function loadData() {
        try {
          const res = await fetch("/api/loai-sp", { cache: "no-store" });
          const data = await res.json();

          if (data.success) {
            listData = data.data;
            const tbody = document.querySelector("#dataTable tbody");
            let html = "";
            data.data.forEach((item) => {
              html += `
                <tr>
                  <td>${item.MaLoaiSP.trim()}</td>
                  <td>${item.TenLoaiSP}</td>
                  <td>
                    <button class="action-btn btn-edit" onclick="editData('${item.MaLoaiSP.trim()}')"><i class="fas fa-edit"></i></button>
                    <button class="action-btn btn-delete" onclick="deleteData('${item.MaLoaiSP.trim()}')"><i class="fas fa-trash"></i></button>
                  </td>
                </tr>
              `;
            });
            tbody.innerHTML =
              html ||
              '<tr><td colspan="3" style="text-align:center;">Chưa có dữ liệu</td></tr>';
          }
        } catch (err) {
          console.error("Lỗi:", err);
        }
      }
      document.addEventListener("DOMContentLoaded", loadData);
    </script>
  </body>
</html>
