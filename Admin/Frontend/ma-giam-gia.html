ũng tính trên phần tiền này</p><div class="form-group"><label for="coupon-title-4">Tên mã giảm giá <span class="required-mark">*</span></label><input type="text" id="coupon-title-4" name="title" maxlength="150" required placeholder="Ví dụ: Ưu đãi cà phê cuối tuần"></div><div class="form-group"><label for="coupon-description-5">Mô tả</label><input type="text" id="coupon-description-5" name="description" maxlength="250"></div><div class="form-row"><div class="form-group"><label for="coupon-kind-6">Loại giảm</label><select id="coupon-kind-6" name="kind"><option value="percent">Phần trăm</option><option value="fixed">Số tiền (đ)</option></select></div><div class="form-group"><label for="coupon-value-7">Giá trị giảm <span class="required-mark">*</span></label><input id="coupon-value-7" name="value" type="number" min="0.001" step="0.001" required></div></div><div class="form-row"><div class="form-group"><label for="coupon-minimum-8">Đơn tối thiểu (đ) <span class="required-mark">*</span></label><input id="coupon-minimum-8" name="minimum" type="number" min="0" step="0.001" value="0" required></div><div class="form-group"><label for="coupon-maximum-9">Giảm tối đa (đ)</label><input id="coupon-maximum-9" name="maximum" type="number" min="0" step="0.001" placeholder="Không giới hạn"></div></div><div class="form-row"><div class="form-group"><label for="coupon-start-10">Từ ngày <span class="required-mark">*</span></label><input id="coupon-start-10" name="start" type="date" required></div><div class="form-group"><label for="coupon-end-11">Đến ngày</label><input id="coupon-end-11" name="end" type="date"></div></div><div class="form-group"><label for="coupon-quantity-12">Số lượng mã</label><input id="coupon-quantity-12" name="quantity" type="number" min="1" max="2147483647" step="1" placeholder="Để trống: không giới hạn"></div><p class="commerce-note">Mã có hiệu lực đến hết ngày kết thúc</p><div class="form-group"><label for="coupon-combine-13">Kết hợp mã khác</label><select id="coupon-combine-13" name="combine"><option value="0">Không cho phép</option><option value="1">Cho phép</option></select></div><div class="form-group"><label for="coupon-status-14">Trạng thái</label><select id="coupon-status-14" name="status"><option value="Hoạt động">Hoạt động</option><option value="Tạm ngưng">Tạm ngưng</option></select></div><div class="modal-footer"><button class="btn directory-cancel" type="button" data-close-directory>Hủy</button><button class="btn" type="submit"><i class="fas fa-save" aria-hidden="true"></i> Lưu mã giảm giá</button></div></form></div></div></main></body></html>
