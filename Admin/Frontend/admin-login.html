<!doctype html>
<html lang="vi" class="auth-viewport">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập Quản trị | JAVI COFFEE</title>
  <meta name="description" content="Trang đăng nhập dành riêng cho quản trị viên và nhân viên JAVI COFFEE." />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="/css/global.css?v=20261021-split" />
  <script src="/runtime-config.js"></script><script src="/admin/js/auth.js?v=20261021-split"></script>
  <style>
    :root { --auth-gold:#e5c16b; --auth-line:#323537; --auth-muted:#a7adb5; }
    html.auth-viewport { height:100dvh !important; max-height:100dvh !important; overflow:hidden !important; }
    body.auth-page {
      min-height:100dvh !important; height:100dvh !important; max-height:100dvh !important;
      margin:0; padding:clamp(12px,2.5vh,24px) 18px !important; overflow:hidden !important;
      display:flex; justify-content:center; align-items:center;
      background:
        radial-gradient(ellipse 38% 46% at 3% 50%,rgba(106,62,30,.13),transparent 92%),
        radial-gradient(ellipse 42% 54% at 99% 30%,rgba(151,108,39,.08),transparent 88%),
        radial-gradient(ellipse 48% 42% at 52% -12%,rgba(234,201,87,.04),transparent 80%),
        linear-gradient(142deg,#090c0f 0%,#040608 42%,#090908 72%,#100d09 100%);
      color:#f4f4f2;
    }
    .auth-backdrop { position:fixed; inset:0; overflow:hidden; pointer-events:none; }
    .auth-backdrop::before {
      content:""; position:absolute; inset:-10%; opacity:.36; filter:blur(26px);
      background:
        radial-gradient(ellipse 30% 45% at 18% 39%,rgba(233,174,57,.15),transparent 78%),
        radial-gradient(ellipse 33% 45% at 88% 64%,rgba(146,76,35,.2),transparent 78%),
        radial-gradient(ellipse 26% 34% at 62% 12%,rgba(234,201,87,.08),transparent 82%);
      animation:authGlow 16s ease-in-out infinite alternate;
    }
    .auth-backdrop::after {
      content:""; position:absolute; inset:0;
      background:radial-gradient(ellipse at center,rgba(4,6,8,.08) 10%,rgba(4,6,8,.2) 100%),
        linear-gradient(rgba(197,155,82,.014) 1px,transparent 1px),
        linear-gradient(90deg,rgba(197,155,82,.014) 1px,transparent 1px);
      background-size:auto,64px 64px,64px 64px;
    }
    .auth-backdrop svg { display:block; width:100%; height:100%; }
    .auth-dongson {
      --motif-size:85vw;
      position:absolute; width:var(--motif-size); height:var(--motif-size);
      left:calc(var(--motif-size) / -2); top:50%; transform:translateY(-50%);
      opacity:.24;
      -webkit-mask-image:linear-gradient(90deg,#000 48%,rgba(0,0,0,.82) 64%,transparent 98%);
      mask-image:linear-gradient(90deg,#000 48%,rgba(0,0,0,.82) 64%,transparent 98%);
    }
    .auth-dongson--right {
      left:auto; right:calc(var(--motif-size) / -2);
      transform:translateY(-50%) scaleX(-1);
    }
    .auth-coffee-scene { position:relative; }
    .auth-wave-line { animation:authWave 12s ease-in-out infinite alternate; }
    .auth-bean-launch {
      transform-box:view-box; transform-origin:50% 50%;
      animation:authBeanBurst 1.45s cubic-bezier(.2,.82,.24,1) both;
    }
    .auth-bean-launch--right { animation-delay:.12s; }
    .auth-bean-art { animation:authFloat 10s ease-in-out infinite alternate; }
    .auth-bean-art--drift { animation-duration:14s; animation-direction:alternate-reverse; }
    .auth-bean-art use { pointer-events:visiblePainted; cursor:pointer; transition:translate .24s cubic-bezier(.2,1.4,.4,1),filter .24s ease; }
    .auth-bean-art use:hover { translate:0 -10px; filter:drop-shadow(0 5px 5px rgba(234,201,87,.35)); }
    @keyframes authWave { to { transform:translateY(16px); } }
    @keyframes authBeanBurst {
      0% { transform:scale(.035); opacity:0; }
      18% { opacity:1; }
      76% { transform:scale(1.045); }
      100% { transform:scale(1); opacity:1; }
    }
    @keyframes authFloat { to { transform:translateY(-9px); } }
    @keyframes authGlow { to { opacity:.4; } }
    .auth-scene { position:relative; z-index:1; width:min(100%,480px); }
    .auth-card {
      position:relative; display:flex; flex-direction:column;
      padding:32px 38px 28px; overflow:hidden;
      border:1px solid rgba(193,151,76,.46); border-radius:22px;
      background:linear-gradient(155deg,#121517 0%,#0b0e11 44%,#07090b 100%);
      box-shadow:0 30px 80px rgba(0,0,0,.64),inset 0 1px 0 rgba(235,207,144,.07);
    }
    .auth-card::before {
      content:""; position:absolute; inset:0 0 auto; height:3px;
      background:linear-gradient(90deg,transparent 8%,#8e642e 28%,#f0d797 50%,#ad823d 72%,transparent 92%);
      opacity:.85;
    }
    .auth-brand { display:flex; justify-content:center; align-items:center; margin-bottom:10px; }
    .auth-brand img { display:block; width:160px; height:auto; object-fit:contain; filter:drop-shadow(0 7px 17px rgba(255,210,28,.16)); }
    .auth-heading { text-align:center; color:var(--auth-gold); font-size:18px; font-weight:700; margin:0 0 20px; }
    .auth-form { display:grid; gap:10px; }
    .auth-field { position:relative; display:block; }
    .auth-field>i { position:absolute; top:50%; left:15px; transform:translateY(-50%); width:18px; color:#969ea7; text-align:center; pointer-events:none; }
    .auth-field input {
      width:100%; height:46px !important; padding:10px 44px !important;
      border:1px solid var(--auth-line) !important; border-radius:10px !important;
      background:#0b0e11 !important; color:#f4f5f6 !important;
      font-size:14px !important; transition:border-color .18s,box-shadow .18s;
    }
    .auth-field input::placeholder { color:#89929c; opacity:1; }
    .auth-field input:focus { border-color:var(--auth-gold) !important; box-shadow:0 0 0 3px rgba(197,155,82,.12) !important; outline:0; }
    .auth-field .password-toggle { left:auto !important; right:14px; color:#a9b1b9; cursor:pointer; pointer-events:auto; }
    .auth-links { display:flex; justify-content:flex-end; margin:1px 0 0; }
    .auth-link { border:0; padding:0; background:none; color:var(--auth-gold); font:inherit; font-size:12px; font-weight:700; cursor:pointer; text-decoration:none; }
    .auth-link:hover { text-decoration:underline; }
    .auth-submit {
      width:100%; height:48px; margin-top:4px; border:0; border-radius:10px;
      background:linear-gradient(110deg,#b88d45,#e7c878 48%,#c49a50); color:#171300; font-size:14px; font-weight:800; cursor:pointer;
      box-shadow:0 6px 20px rgba(184,141,69,.14); transition:transform .18s,filter .18s;
    }
    .auth-submit:hover { transform:translateY(-2px); filter:brightness(1.06); }
    .auth-submit:disabled { cursor:wait; opacity:.7; transform:none; }
    .auth-note { margin:14px 0 0; text-align:center; color:var(--auth-muted); font-size:11px; line-height:1.5; }
    @media(max-width:600px){
      body.auth-page { padding:20px 14px !important; }
      .auth-backdrop::before { opacity:.4; }
      .auth-card { padding:26px 22px 22px; border-radius:17px; }
      .auth-brand img { width:150px; }
    }
    @media(prefers-reduced-motion:reduce){
      .auth-submit { transition:none; }
      .auth-wave-line,.auth-bean-launch,.auth-bean-art { animation:none; }
      .auth-backdrop::before { animation:none; }
    }
</style>
<link rel="stylesheet" href="/css/auth-motif-motion.css">
</head>

</div>
<main class="auth-scene" aria-label="Đăng nhập quản trị JAVI COFFEE">
  <div class="auth-card">
    <div class="auth-brand"><img src="/images/logo-javi-auth.png" alt="JAVI COFFEE" /></div>
    <h1 class="auth-heading">Đăng nhập Quản trị</h1>
    <form class="auth-form" id="loginForm">
      <label class="auth-field"><i class="fas fa-user"></i><input type="text" id="login-username" placeholder="Tài khoản nhân viên" autocomplete="username" required /></label>
      <label class="auth-field"><i class="fas fa-lock"></i><input type="password" id="login-password" placeholder="Mật khẩu" autocomplete="current-password" required /><i class="fas fa-eye password-toggle" id="togglePw" aria-label="Hiện mật khẩu"></i></label>
      <div class="auth-links"><a class="auth-link" href="#" id="forgotPassword">Quên mật khẩu?</a></div>
      <button class="auth-submit" type="submit" id="loginSubmitBtn">Đăng nhập</button>
    </form>
    <p class="auth-note">Trang này dành riêng cho quản trị viên và nhân viên.<br>Khách hàng vui lòng đăng nhập tại <a class="auth-link" href="${shopUrl}">cửa hàng</a>.</p>
  </div>
</main>
<script>
  // Trang này CHỈ phục vụ admin/nhân viên (cổng 3001). Không có Google, không có đăng ký.
  const shopUrl = window.JAVI_RUNTIME && window.JAVI_RUNTIME.shopUrl ? window.JAVI_RUNTIME.shopUrl : 'http://localhost:3000';
  document.querySelector('.auth-note a').href = shopUrl;
  const byId = (id) => document.getElementById(id);
  byId('togglePw').addEventListener('click', () => {
    const inp = byId('login-password'), vis = inp.type === 'text';
    inp.type = vis ? 'password' : 'text';
    byId('togglePw').classList.toggle('fa-eye-slash', !vis);
  });
  const showMsg = async (msg, type='error') => window.javiAlert ? javiAlert(msg, type) : alert(msg);
  const setLoading = (btn, loading) => { btn.disabled = loading; btn.textContent = loading ? 'Đang xử lý...' : 'Đăng nhập'; };
  byId('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = byId('loginSubmitBtn'); setLoading(btn, true);
    try {
      const r = await fetch('/api/login', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({TenDangNhap:byId('login-username').value,MatKhau:byId('login-password').value})});
      const d = await r.json();
      if(!r.ok) throw new Error(d.message);
      const user = d.data;
      // Kiểm tra client-side bổ sung (server đã xác nhận)
      if(!user.MaNV || user.VaiTro === 'KHACH_HANG') throw new Error('Vui lòng sử dụng tài khoản quản trị hoặc nhân viên.');
      localStorage.setItem('currentUser', JSON.stringify(user));
      localStorage.setItem('javiLastActivity', String(Date.now()));
      window.location.href = '/admin/dashboard.html';
    } catch(err){ showMsg(err.message || 'Không thể đăng nhập.'); } finally{ setLoading(btn, false); }
  });
  byId('forgotPassword').addEventListener('click', (e) => { e.preventDefault(); showMsg('Vui lòng liên hệ quản trị viên hệ thống để đặt lại mật khẩu.', 'info'); });
</script></body></html>
