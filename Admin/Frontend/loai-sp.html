<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản Lý Loại Sản Phẩm - JAVI COFFEE</title>
    <link rel="stylesheet" href="/css/global.css?v=20261021-form-unified" />
    <link rel="stylesheet" href="/admin/css/sidebar.css?v=20261021-action-fit-2" />
    <link rel="stylesheet" href="/admin/css/san-pham.css" /><link rel="stylesheet" href="/admin/css/product-options.css?v=20261021-form-unified" />
    <link
      rel="stylesheet"
      href="/vendor/fontawesome/css/all.min.css"
    />
    <script src="/admin/js/auth.js?v=20261021-form-unified"></script>
    <script src="/admin/js/report-filters.js?v=20261021-action-fit-2"></script>
      <!-- Google Fonts: 2 font chuẩn xuyên suốt hệ thống (Hỗ trợ 100% tiếng Việt) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Outfit:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
<script src="/admin/js/product-options.js" defer></script><script src="/admin/js/grid-files.js" defer></script><script src="/admin/js/ui-consistency.js?v=20261021-form-unified" defer></script><link rel="stylesheet" href="/admin/css/admin-design.css">
<script defer src="/admin/js/admin-design.js"></script>
</head>
  <body>
    <div class="sidebar"></div>

    <div class="main-content">
      <div class="page-header">
        <h2><i class="fas fa-tags"></i> QUẢN LÝ LOẠI SẢN PHẨM</h2>
        <button class="btn" onclick="openModal()">
          <i class="fas fa-plus"></i> Thêm Loại Sản Phẩm
        </button>
      </div>
      <div class="table-responsive">
        <table id="dataTable">
          <thead>
            <tr>
<th>Mã Loại Sản Phẩm</th>
              <th>Tên Loại Sản Phẩm</th><th>Tùy chọn cà phê</th>
              <th style="text-align: right;"></th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="4" style="text-align: center">
                Đang tải dữ liệu...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    
      
    </div>

    <!-- KHUNG MODAL -->
    <div class="modal-overlay" id="addModal">
      <div class="modal-content">
        <div class="modal-header">
          <h3><i class="fas fa-plus-circle"></i> Thêm Loại Sản Phẩm</h3>
          <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>
        <form id="addForm">
          <div class="section-title">Thông tin phân loại</div>
          <div class="form-group">
            <label
              >Mã Loại Sản Phẩm (Tối đa 3 ký tự)
              <span style="color: red">*</span></label
            >
            <input type="text" id="maLoaiSP" required maxlength="3" />
          </div>
          <div class="form-group">
            <label>Tên Loại Sản Phẩm <span style="color: red">*</span></label>
            <input type="text" id="tenLoaiSP" required />
          </div>
          <div class="form-group"><label class="option-toggle"><input type="checkbox" id="apDungTuyChon" onchange="renderTypeOptions()"> Cho phép chọn trọng lượng và loại xay</label></div>
          <div id="typeOptions"></div>
          <div
            class="modal-footer"
            style="
              display: flex;
              justify-content: flex-end;
              gap: 10px;
              margin-top: 20px;
            "
          >
            <button
              type="button"
              class="btn"
              style="background-color: #333; color: #fff"
              onclick="closeModal()"
            >
              Hủy
            </button>
            <button type="submit" class="btn">Lưu Loại Sản Phẩm</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      let listData = [];
      let editId = null;

      function openModal() {
        document.getElementById("addForm").reset();
        editId = null;
        renderTypeOptions();
        document.getElementById("maLoaiSP").readOnly = false;
        document.querySelector(".modal-header h3").innerHTML =
          '<i class="fas fa-plus-circle"></i> Thêm Loại Sản Phẩm';
        document.getElementById("addModal").style.display = "flex";
      }

      function closeModal() {
        document.getElementById("addModal").style.display = "none";
      }

      function editData(id) {
        const item = listData.find((x) => x.MaLoaiSP.trim() === id.trim());
        if (!item) return;
        editId = item.MaLoaiSP.trim();
        document.getElementById("maLoaiSP").value = item.MaLoaiSP.trim();
        document.getElementById("maLoaiSP").readOnly = true;
        document.getElementById("tenLoaiSP").value = item.TenLoaiSP;
        document.getElementById("apDungTuyChon").checked = !!item.ApDungTuyChon;
        renderTypeOptions(editId);
        document.querySelector(".modal-header h3").innerHTML =
          '<i class="fas fa-edit"></i> Cập Nhật Loại Sản Phẩm';
        document.getElementById("addModal").style.display = "flex";
      }

      async function deleteData(id) {
        const confirmed = await javiConfirm("Bạn có chắc muốn xóa Loại Sản Phẩm " + id + " ?");
        if (!confirmed) return;
        try {
          const res = await fetch("/api/loai-sp/" + id.trim(), {
            method: "DELETE",
          });
          const data = await res.json();
          if (data.success) {
            alert(data.message);
            loadData();
          } else alert("Lỗi: " + data.message);
        } catch (e) {
          alert("Lỗi kết nối server");
        }
      }

      document
        .getElementById("addForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          const payload = {
            maLoaiSP: document.getElementById("maLoaiSP").value.trim(),
            tenLoaiSP: document.getElementById("tenLoaiSP").value.trim(),
            apDungTuyChon: document.getElementById("apDungTuyChon").checked,
            loaiXay: [...document.querySelectorAll('[name="typeGrind"]:checked')].map(x=>Number(x.value)),
            trongLuong: [...document.querySelectorAll('[name="typeWeight"]:checked')].map(x=>Number(x.value)),
          };

          const url = editId ? "/api/loai-sp/" + editId : "/api/loai-sp";
          const method = editId ? "PUT" : "POST";

          try {
            const res = await fetch(url, {
              method,
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });
            const data = await res.json();
            if (data.success) {
              alert(data.message);
              closeModal();
              loadData();
            } else alert("Lỗi: " + data.message);
          } catch (err) {
            alert("Lỗi Server!");
          }
        });



      async function loadData() {
        try {
          await loadOptionCatalogs();
          const res = await fetch("/api/loai-sp", { cache: "no-store" });
          const data = await res.json();

          if (data.success) {
            listData = data.data;
            const tbody = document.querySelector("#dataTable tbody");
            let html = "";
            data.data.forEach((item) => {
              html += `
                <tr data-row-edit="editData" data-edit-id="${encodeURIComponent(item.MaLoaiSP.trim())}">
                  
<td>${item.MaLoaiSP.trim()}</td>
                  <td>${item.TenLoaiSP}</td><td>${item.ApDungTuyChon?'Trọng lượng và loại xay':'Không áp dụng'}</td>
                  <td>
                    <button class="action-btn btn-delete" onclick="deleteData('${item.MaLoaiSP.trim()}')"><i class="fas fa-trash"></i></button>
                  </td>
                </tr>
              `;
            });
            tbody.innerHTML =
              html ||
              '<tr><td colspan="4" style="text-align:center;">Chưa có dữ liệu</td></tr>';
          }
        } catch (err) {
          console.error("Lỗi:", err);
        }
      }
      document.addEventListener("DOMContentLoaded", loadData);
    </script>
  </body>
</html>
