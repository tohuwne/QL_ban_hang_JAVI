<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản Lý Khách Hàng - JAVI COFFEE</title>
    <link rel="stylesheet" href="/css/global.css?v=20261021-form-unified" />
    <link rel="stylesheet" href="/admin/css/sidebar.css?v=20261021-action-fit-2" />
    <link rel="stylesheet" href="/admin/css/san-pham.css" />
    <!-- Tái sử dụng CSS để có UI đẹp -->
    <link
      rel="stylesheet"
      href="/vendor/fontawesome/css/all.min.css"
    />
    <script src="/admin/js/auth.js?v=20261021-form-unified"></script>
    <script src="/admin/js/report-filters.js?v=20261021-action-fit-2"></script>
      <!-- Google Fonts: 2 font chuẩn xuyên suốt hệ thống (Hỗ trợ 100% tiếng Việt) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Outfit:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
<script src="/admin/js/grid-files.js" defer></script><script src="/admin/js/ui-consistency.js?v=20261021-form-unified" defer></script><link rel="stylesheet" href="/admin/css/admin-design.css">
<script defer src="/admin/js/admin-design.js"></script>
</head>
  <body>
    <div class="sidebar"></div>

    <div class="main-content">
      <div class="page-header">
        <h2><i class="fas fa-users"></i> QUẢN LÝ KHÁCH HÀNG</h2>
        <button class="btn" onclick="openModal()">
          <i class="fas fa-plus"></i> Thêm Khách Hàng
        </button>
      </div>

      <div class="filter-section category-badges" id="categoryBadges" aria-label="Lọc theo loại khách hàng">
        <button type="button" class="filter-btn active" data-category="">Tất cả</button>
      </div>

      <div class="table-responsive">
        <table id="dataTable">
          <thead>
            <tr>
<th>Mã KH</th>
              <th>Tên Khách Hàng</th>
              <th>Số Điện Thoại</th>
              <th>Email</th>
              <th>Phân Loại</th>
              <th style="text-align: right;"></th>
            </tr>
          </thead>
          <tbody>
            <tr>
              
<td>KH001</td>
              <td>Nguyễn Thanh Tùng</td>
              <td>0903111001</td>
              <td>tung.nt@gmail.com</td>
              <td style="color: var(--color-primary)">Khách lẻ</td>
              <td></td>
            </tr>
          </tbody>
        </table>
      </div>
    
      
    </div>

    <!-- KHUNG MODAL -->
    <div class="modal-overlay" id="addModal">
      <div class="modal-content">
        <div class="modal-header">
          <h3><i class="fas fa-user-plus"></i> Thêm Khách Hàng Mới</h3>
          <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>
        <form id="addForm">
          <div class="section-title">Thông tin khách hàng</div>
          <div class="form-group">
            <label>Tên Khách Hàng <span style="color: red">*</span></label>
            <input type="text" id="tenKH" required />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Số Điện Thoại <span style="color: red">*</span></label>
              <input type="text" id="soDT" required />
            </div>
            <div class="form-group">
              <label>Giới Tính</label>
              <select id="gioiTinh">
                <option value="Nam">Nam</option>
                <option value="Nữ">Nữ</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" />
          </div>
          <div class="section-title">Liên hệ và phân loại</div>
          <div class="form-row">
            <div class="form-group" style="flex: 2">
              <label>Địa Chỉ</label>
              <input type="text" id="diaChi" />
            </div>
            <div class="form-group">
              <label>Loại Khách Hàng</label>
              <select id="maLoai">
                <option value="L01">Khách lẻ</option>
                <option value="S01">Khách sỉ</option>
                <option value="V01">Khách VIP</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn"
              style="background-color: #333; color: #fff"
              onclick="closeModal()"
            >
              Hủy Bỏ
            </button>
            <button type="submit" class="btn">Lưu Khách Hàng</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      let listData = [];
      let editId = null;
      let activeCustomerCategory = "";

      const modal = document.getElementById("addModal");
      function openModal() {
        document.getElementById("addForm").reset();
        editId = null;
        document.querySelector(".modal-header h3").innerHTML =
          '<i class="fas fa-user-plus"></i> Thêm Khách Hàng Mới';
        modal.style.display = "flex";
      }
      function closeModal() {
        modal.style.display = "none";
      }

      function editKhachHang(id) {
        const item = listData.find((x) => x.MaKH === id);
        if (!item) return;
        editId = id;
        document.getElementById("tenKH").value = item.TenKH;
        document.getElementById("soDT").value = item.SoDTKH;
        document.getElementById("gioiTinh").value = item.GioiTinhKH;
        document.getElementById("email").value = item.EmailKH;
        document.getElementById("diaChi").value = item.DiaChiKH;
        document.getElementById("maLoai").value = item.MaLoaiKH;
        document.querySelector(".modal-header h3").innerHTML =
          '<i class="fas fa-edit"></i> Cập Nhật Khách Hàng';
        modal.style.display = "flex";
      }

      async function deleteKhachHang(id) {
        const confirmed = await javiConfirm("Bạn có chắc muốn xóa khách hàng " + id + " ?");
        if (!confirmed) return;
        try {
          const res = await fetch("/api/khach-hang/" + id, {
            method: "DELETE",
          });
          const data = await res.json();
          if (data.success) {
            alert(data.message);
            loadData();
          } else alert("Lỗi: " + data.message);
        } catch (e) {
          alert("Lỗi kết nối server");
        }
      }

      document
        .getElementById("addForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          const payload = {
            tenKH: document.getElementById("tenKH").value,
            soDT: document.getElementById("soDT").value,
            gioiTinh: document.getElementById("gioiTinh").value,
            email: document.getElementById("email").value,
            diaChi: document.getElementById("diaChi").value,
            maLoai: document.getElementById("maLoai").value,
          };
          try {
            const url = editId
              ? "/api/khach-hang/" + editId
              : "/api/khach-hang";
            const method = editId ? "PUT" : "POST";
            const res = await fetch(url, {
              method: method,
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });
            const data = await res.json();
            if (data.success) {
              alert(data.message);
              closeModal();
              loadData();
            } else alert("Lỗi: " + data.message);
          } catch (err) {
            alert("Lỗi Server!");
          }
        });

      function filterKH() {
        const rows = document.querySelectorAll("#dataTable tbody tr");
        rows.forEach((row) => {
          if (row.cells.length < 5) return;
          const category = row.cells[4].textContent;
          const matchCategory = !activeCustomerCategory || category.includes(activeCustomerCategory);
          row.classList.toggle("filter-hidden", !matchCategory);
        });
        updatePagination(document.getElementById("dataTable"));
      }

      function setCustomerCategoryFilter(category, button) {
        activeCustomerCategory = category;
        document.querySelectorAll("#categoryBadges .filter-btn").forEach((item) =>
          item.classList.toggle("active", item === button),
        );
        filterKH();
      }

      async function loadData() {
        try {
          const res = await fetch("/api/khach-hang");
          const data = await res.json();
          if (data.success) {
            listData = data.data;
            const tbody = document.querySelector("#dataTable tbody");
            let html = "";
            data.data.forEach((item) => {
              html += `
                <tr data-row-edit="editKhachHang" data-edit-id="${encodeURIComponent(item.MaKH)}">
                  
<td>${item.MaKH}</td>
                  <td>${item.TenKH}</td>
                  <td>${item.SoDTKH || ""}</td>
                  <td>${item.EmailKH || ""}</td>
                  <td style="color: var(--color-primary)">${item.TenLoaiKH}</td>
                  <td>
                    <button class="action-btn btn-delete" onclick="deleteKhachHang('${item.MaKH}')"><i class="fas fa-trash"></i></button>
                  </td>
                </tr>
              `;
            });
            tbody.innerHTML =
              html ||
              '<tr><td colspan="6" style="text-align:center;">Chưa có dữ liệu</td></tr>';
          }
        } catch (err) {
          console.error("Lỗi:", err);
        }
      }

      async function loadCustomerTypes() {
        try {
          const response = await fetch("/api/loai-kh", { cache: "no-store" });
          const data = await response.json();
          if (data.success) {
            const badgeGroup = document.getElementById("categoryBadges");
            const formSelect = document.getElementById("maLoai");
            badgeGroup.innerHTML = "";
            const addBadge = (label, value) => {
              const button = document.createElement("button");
              button.type = "button";
              button.className = "filter-btn";
              button.textContent = label;
              button.classList.toggle("active", value === activeCustomerCategory);
              button.addEventListener("click", () => setCustomerCategoryFilter(value, button));
              badgeGroup.appendChild(button);
            };
            addBadge("Tất cả", "");
            formSelect.innerHTML = "";

            data.data.forEach((item) => {
              if (item.MaLoaiKH && item.TenLoaiKH) {
                addBadge(item.TenLoaiKH, item.TenLoaiKH);
                formSelect.innerHTML += `<option value="${item.MaLoaiKH.trim()}">${item.TenLoaiKH}</option>`;
              }
            });
          }
        } catch (error) {
          console.error("Lỗi load loại khách hàng:", error);
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        loadCustomerTypes();
        loadData();
      });
    </script>
  </body>
</html>
