<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Hoàn tất thông tin nhận hàng và phương thức thanh toán tại JAVI."><title>Thông tin & thanh toán · JAVI COFFEE</title><link rel="stylesheet" href="/user/css/storefront.css"><link rel="stylesheet" href="/user/css/storefront-theme.css?v=20261022-content"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet"><script src="/user/js/storefront.js?v=20261022-content" defer></script></head><body data-store-page="checkout"><div id="siteHeader"></div><main class="wrap"><div class="checkout-back"><a class="button light" href="gio-hang.html">Quay lại giỏ hàng</a></div><div id="checkoutError" class="error-message" role="alert" hidden></div><form id="checkoutForm" class="checkout-layout"><section><div class="panel"><h2>Gửi đến người nhận</h2><div class="form-grid"><label class="form-field">Họ và tên *<input id="receiverName" name="name" autocomplete="name" required maxlength="100"></label><label class="form-field">Số điện thoại *<input id="receiverPhone" name="tel" type="tel" autocomplete="tel" required minlength="9" maxlength="20"></label><label class="form-field wide">Email nhận xác nhận đơn *<input id="receiverEmail" name="email" type="email" autocomplete="email" required maxlength="100"><span class="field-help">Thông tin đơn hàng được gửi tới địa chỉ này</span></label><label class="form-field wide">Địa chỉ đã lưu<select id="savedAddress"><option value="">Nhập địa chỉ mới</option></select></label><label class="form-field">Tỉnh / Thành phố *<select id="receiverProvince" required><option value="">Chọn tỉnh / thành</option></select></label><label class="form-field">Phường / Xã *<select id="receiverWard" required disabled><option value="">Chọn phường / xã</option></select></label><label class="form-field wide">Địa chỉ chi tiết *<textarea id="receiverAddress" name="street-address" autocomplete="street-address" required rows="2" maxlength="500" placeholder="Số nhà, tên đường, tòa nhà..."></textarea></label><label class="address-save"><input type="checkbox" id="saveAddress" checked> Lưu địa chỉ này cho lần mua sau</label><label class="form-field wide">Lời nhắn cho JAVI<textarea id="receiverNote" rows="2" maxlength="1000" placeholder="Ghi chú để việc giao hàng thuận tiện hơn…"></textarea></label></div></div><div class="panel" style="margin-top:20px"><h2>Chọn cách thanh toán</h2><label class="payment-method"><input type="radio" name="payment" value="Tiền mặt" checked><span><strong>Thanh toán khi nhận hàng (COD)</strong><small>Thanh toán tiền mặt sau khi nhận hàng</small></span></label><label class="payment-method"><input type="radio" name="payment" value="Chuyển khoản"><span><strong>Chuyển khoản ngân hàng</strong><small>Thanh toán để hoàn tất đơn hàng</small></span></label><div id="bankDetails" class="bank-note" hidden></div></div></section><aside id="checkoutSummary" class="panel"><div class="loading">Đang kiểm tra giỏ hàng</div></aside></form></main><div id="siteFooter"></div><div id="storeToast" class="toast" role="status" hidden></div></body></html>
